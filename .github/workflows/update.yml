name: Daily PSX Update
on:
  schedule:
    - cron: '0 4 * * *' # 9:00 AM Pakistan Time (4:00 AM UTC)
  workflow_dispatch: 

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install pandas psxdata
          
      - name: Run Step 1 (Download)
        run: python step1.py
        
      - name: Run Step 2 (Scan)
        run: python step2.py
        
      - name: Run Step 3 (Generate HTML)
        run: python step3.py
        
      - name: Commit and Push updates
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/ history.json scan_results.json index.html
          git commit -m "Auto update $(date)" || exit 0
          git push
